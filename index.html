<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dual Mode Game</title>

<style>
body{
    background-color:black;
    margin:0;
    overflow:hidden;
}

/* ✅ RESPONSIVE GAME AREA */
#gameArea {
    margin: auto;
    width: 95vw;
    max-width: 1300px;
    height: 70vh;
    max-height: 580px;
    position: relative;
    background-image: url(./universe_0.jpg);
    background-size: cover;
    background-position: center;
    overflow: hidden;
    border: 4px solid gray;
    border-radius: 20px;
}

/* ✅ RESPONSIVE PLAYER */
#player {
    width: 6vw;
    height: 6vw;
    max-width: 40px;
    max-height: 40px;
    min-width: 28px;
    min-height: 28px;
    background-color: red;
    position: absolute;
    top: 530px;
    left: 500px;
    border-radius: 50%;
}

/* ✅ RESPONSIVE OBSTACLE */
.obstacle {
    width: 8vw;
    height: 8vw;
    max-width: 60px;
    max-height: 60px;
    min-width: 35px;
    min-height: 35px;
    /* background-image: url(./oip.jpg); */
    background-color:blue;
    background-size: cover;
    position: absolute;
    border-radius: 50%;
}

button{
    background-color:brown;
    color:white;
    font-weight:bold;
    cursor:pointer;
    border-radius:4px;
}

#menu{
    text-align:center;
    margin-top:5px;
}

/* STOP SCREEN */
#stop{
    margin:auto;
    width:80%;
    height:60%;
    background:black;
    border:4px solid gray;
    position:absolute;
    inset:0;
    display:none;
    z-index:5;
    box-shadow:0 0 200px gray;
}

/* MOBILE CONTROLS */
#controls{
    position:fixed;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    z-index:10;
}

#controls button{
    width:55px;
    height:55px;
    font-size:22px;
    border-radius:50%;
}
</style>
</head>

<body>

<div id="gameArea">
    <div id="player"></div>

    <div id="stop">
        <h1 style="color:white;text-align:center;">🚫 GAME STOP 🚫</h1>
        <p style="color:white;text-align:center;font-size:22px;">
            PRESS <b>W</b> TO START
        </p>
    </div>
</div>

<div id="menu">
    <button onclick="difficult('Easy')">Easy</button>
    <button onclick="difficult('Medium')">Medium</button>
    <button onclick="difficult('Hard')">Hard</button>
    <button onclick="resume()">STOP</button>
</div>

<div id="score" style="color:white;text-align:center;">Score: 0</div>

<!-- ✅ MOBILE ARROW BUTTONS -->
<div id="controls">
    <button ontouchstart="keys['ArrowLeft']=true" ontouchend="keys['ArrowLeft']=false">⬅</button>
    <button ontouchstart="keys['ArrowUp']=true" ontouchend="keys['ArrowUp']=false">⬆</button>
    <button ontouchstart="keys['ArrowDown']=true" ontouchend="keys['ArrowDown']=false">⬇</button>
    <button ontouchstart="keys['ArrowRight']=true" ontouchend="keys['ArrowRight']=false">➡</button>
</div>

<script>
let game = 9;
let spamrate = 0.05;
let myspeed = 7;
let spamMode = false;

const player = document.getElementById("player");
const gameArea = document.getElementById("gameArea");
const scoreEl = document.getElementById("score");

let score = 0;
let running = true;
let horizontalMode = false;
let playerPos = { x: 200, y: 500 };
let keys = {};
document.addEventListener("keydown", e => keys[e.key]=true);
document.addEventListener("keyup", e => keys[e.key]=false);
let obstacles = [];
let horizontalObstacles = [];
/* DIFFICULTY */
function difficult(level){
    if(level==="Easy"){ game=4; spamrate=0.03; myspeed=5; }
    if(level==="Medium"){ game=9; spamrate=0.05; myspeed=7; }
    if(level==="Hard"){ game=14; spamrate=0.07; myspeed=15; }
}
/* STOP */
function resume(){
    game=0; spamrate=0;
    document.getElementById("stop").style.display="block";
    document.addEventListener("keydown",function(e){
        if(e.key==="w"||e.key==="W"){
            game=9; spamrate=0.05; myspeed=7;
            document.getElementById("stop").style.display="none";
        }
    });
}
function top(){
    game=2; spamrate=1;
    document.getElementById("game").style.display="none"
    document.addEventListener("keydown",function(e){
        if(e.key==="w"||e.key==="w"){
            game=7; spamrate=0.5; myspeed = 7;
            document.getElementById("STOP").style.display="none";
        }
    });
}
/* FALLING OBSTACLE */
function createFallingObstacle(){
    let obs=document.createElement("div");
    obs.className="obstacle";
    obs.style.left=Math.random()*(gameArea.clientWidth-60)+"px";
    obs.style.top="0px";
    gameArea.appendChild(obs);
    return obs;
}
/* UPDATE MODE 1 */
function updateFallingMode(){
    if(keys["ArrowLeft"]&&playerPos.x>0)playerPos.x-=myspeed;
    if(keys["ArrowRight"]&&playerPos.x<gameArea.clientWidth-40)playerPos.x+=myspeed;
    if(keys["ArrowUp"]&&playerPos.y>0)playerPos.y-=myspeed;
    if(keys["ArrowDown"]&&playerPos.y<gameArea.clientHeight-40)playerPos.y+=myspeed;

    player.style.left=playerPos.x+"px";
    player.style.top=playerPos.y+"px";

    obstacles.forEach((obs,i)=>{
        let y=parseInt(obs.style.top);
        y+=game;
        obs.style.top=y+"px";
        if(!spamMode){
            if(y+40>playerPos.y && y<playerPos.y+40 &&
               parseInt(obs.style.left)+40>playerPos.x &&
               parseInt(obs.style.left)<playerPos.x+40){
                alert("GAME OVER! Score: "+score);
                location.reload();
            }
        }
        if(y>gameArea.clientHeight){
            obs.remove();
            obstacles.splice(i,1);
            score++;
            scoreEl.innerText="Score: "+score;
        }
    });
    if(Math.random()<spamrate)obstacles.push(createFallingObstacle());
}
/* MAIN LOOP */
function updateGame(){
    if(!running)return;
    updateFallingMode();
    requestAnimationFrame(updateGame);
}
updateGame();
/* ✅ TOUCH DRAG CONTROL */
let tx=null, ty=null;
gameArea.addEventListener("touchstart",e=>{
    tx=e.touches[0].clientX;
    ty=e.touches[0].clientY;
});
gameArea.addEventListener("touchmove",e=>{
    e.preventDefault();
    let t=e.touches[0];
    let dx=t.clientX-tx;
    let dy=t.clientY-ty;
    playerPos.x+=dx*0.2;
    playerPos.y+=dy*0.2;
    tx=t.clientX; ty=t.clientY;
},{passive:false});
</script>

</body>
</html>
